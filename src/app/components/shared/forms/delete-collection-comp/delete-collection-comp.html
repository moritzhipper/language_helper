<form [formGroup]="form" (ngSubmit)="confirm(form.value)" class="modal">
  <h2 class="fly-in-0">dissolve collection?</h2>

  <app-radio-comp
    class="fly-in-0"
    formControlName="deletionType"
    label="keep or remove cards?"
    [config]="[
      { value: 'dissolve', label: 'keep cards' },
      { value: 'remove', label: 'remove cards' }
    ]"
  />

  <button type="button" class="big fly-in-1" (click)="cancel()">cancel</button>
  <button type="submit" class="fly-in-2">confirm</button>
</form>
