<form (ngSubmit)="confirm(this.bankExport())" class="modal" [formGroup]="form">
  <h2 class="full fly-in-y-0">Import {{ bankExport().name }}?</h2>
  <div class="preview-wrapper full">
    @if (collectionPreviews().length > 1) {
      @for (prev of collectionPreviews(); track prev) {
        <div class="preview fly-in-y-0">
          <app-icon-comp type="collection" />

          {{ prev.name }}
          @for (lexeme of prev.lexemes; track lexeme) {
            <span>{{ lexeme }}</span>
          }
        </div>
      }
    }
  </div>
  <button type="button" class="big fly-in-y-1" (click)="cancel()">
    cancel
  </button>
  <button type="submit" class="fly-in-y-2">import</button>
</form>
