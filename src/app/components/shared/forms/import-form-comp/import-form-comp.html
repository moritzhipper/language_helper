<form (ngSubmit)="confirm()" class="modal">
  <div class="summary full fly-in-y-0">
    <h2 class="full">import {{ bankExport().learnables.length }} cards?</h2>
    <div class="collections">
      @for (collection of bankExport().collections; track $index) {
        <span
          >{{ collection.name }} ({{
            collection.learnableIDs.length
          }}
          cards)</span
        >
      }

      @if (unsortedLearnablesCount() > 0) {
        <span>unsorted ({{ unsortedLearnablesCount() }} cards) </span>
      }
    </div>
  </div>
  <button type="button" class="big fly-in-y-1" (click)="cancel()">
    cancel
  </button>
  <button type="submit" class="fly-in-y-2">confirm</button>
</form>
