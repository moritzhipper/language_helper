<form (ngSubmit)="confirm()" class="modal">
  <div class="summary full fly-in-y-0">
    <h2 class="full">{{ bankExport().name }}</h2>

    <div class="preview">
      @for (card of previewCards(); track card) {
        <span>{{ card }}</span>
      }
      @if (cutoffCount() > 0) {
        <span class="cutoff-count"> {{ cutoffCount() }} more</span>
      }
    </div>
  </div>
  <button type="button" class="big fly-in-y-1" (click)="cancel()">
    cancel
  </button>
  <button type="submit" class="fly-in-y-2">confirm</button>
</form>
