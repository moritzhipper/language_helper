<form class="modal">
  <div class="content fly-in-0">
    @if (message(); as message) {
      <h2>
        {{ message }}
      </h2>
    } @else {
      <ng-content />
    }
  </div>

  <button type="button" (click)="cancel()" class="big fly-in-1">cancel</button>
  <button type="submit" (click)="confirm()" class="fly-in-2">
    {{ label() }}
  </button>
</form>
