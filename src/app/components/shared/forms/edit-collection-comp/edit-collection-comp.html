<form [formGroup]="form" (ngSubmit)="confirm(form.value.name)" class="modal">
  <h2 class="fly-in-0">edit collection</h2>
  <label class="fly-in-0">
    <span> name </span>
    <input type="text" formControlName="name" />
  </label>

  <button type="button" class="big fly-in-1" (click)="cancel()">cancel</button>
  <button type="submit" class="fly-in-2" [disabled]="form.invalid">save</button>
</form>
