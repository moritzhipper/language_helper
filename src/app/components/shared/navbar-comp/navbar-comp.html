<button
  class="toggle"
  (click)="toggleLinks()"
  [class]="{
    pulse: pulseToggle(),
    open: linksAreOpen(),
    subdue: subdueToggle()
  }"
>
  <app-icon-comp type="menu" />
</button>
@if (linksAreOpen()) {
  <h2 class="fly-in-x-0">learn with me</h2>
  <a
    class="link big practice fly-in-x-1"
    routerLink="practice"
    [class.pulse]="pulsePractice()"
  >
    <app-icon-comp type="learn" />
    <span>practice</span>
  </a>
  <a routerLink="cards" class="link big fly-in-x-2">
    <app-icon-comp type="card" />
    <span>cards</span>
  </a>
  <a routerLink="collections" class="link big fly-in-x-3">
    <app-icon-comp type="collection" />
    <span>collections</span>
  </a>
  <a routerLink="about" class="link small about fly-in-x-4">
    <app-icon-comp type="info" />
    <span>about</span>
  </a>
  <a routerLink="settings" class="link small fly-in-x-5">
    <app-icon-comp type="settings" />
    <span>settings</span>
  </a>
}
