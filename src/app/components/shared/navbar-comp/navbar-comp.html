<button
  class="toggle"
  (click)="toggleLinks()"
  [class]="{
    pulse: pulseToggle(),
    open: linksAreOpen(),
    subdue: subdueToggle()
  }"
>
  <app-icon-comp type="menu" />
</button>
@if (linksAreOpen()) {
  <a routerLink="settings" class="link fly-in-x-0">
    <app-icon-comp type="settings" />
  </a>
  <a routerLink="collections" class="link fly-in-x-1">
    <app-icon-comp type="collection" />
  </a>
  <a routerLink="cards" class="link fly-in-x-2">
    <app-icon-comp type="card" />
  </a>
  <a
    class="link practice fly-in-x-3"
    routerLink="practice"
    [class.pulse]="pulsePractice()"
  >
    <app-icon-comp type="learn" />
  </a>
}
