<button
  class="toggle"
  (click)="toggleLinks()"
  [class]="{
    pulse: pulseToggle(),
    open: linksAreOpen(),
    subdue: subdueToggle()
  }"
>
  <app-icon-comp type="menu" />
</button>

@if (linksAreOpen()) {
  <h2 animate.enter="fly-in-xy-0" animate.leave="fly-out-xy">learn with me</h2>
  <a
    class="link big practice"
    routerLink="practice"
    [class.pulse]="pulsePractice()"
    animate.enter="fly-in-xy-1"
    animate.leave="fly-out-xy"
  >
    <app-icon-comp type="learn" />
    <span>practice</span>
  </a>
  <a
    routerLink="cards"
    class="link big"
    animate.enter="fly-in-xy-2"
    animate.leave="fly-out-xy"
  >
    <app-icon-comp type="card" />
    <span>cards</span>
  </a>
  <a
    routerLink="collections"
    class="link big"
    animate.enter="fly-in-xy-3"
    animate.leave="fly-out-xy"
  >
    <app-icon-comp type="collection" />
    <span>collections</span>
  </a>
  <a
    routerLink="about"
    class="link small about"
    animate.enter="fly-in-xy-4"
    animate.leave="fly-out-xy"
  >
    <app-icon-comp type="info" />
    <span>about</span>
  </a>
  <a
    routerLink="settings"
    class="link small"
    animate.enter="fly-in-xy-5"
    animate.leave="fly-out-xy"
  >
    <app-icon-comp type="settings" />
    <span>settings</span>
  </a>
  <div class="fake-shadow" animate.enter="enter" animate.leave="leave"></div>
}
