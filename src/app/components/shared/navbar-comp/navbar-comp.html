<button
  class="toggle"
  (click)="toggleLinks()"
  [class]="{ pulse: pulseToggle(), open: linksAreOpen() }"
>
  <app-icon-comp type="menu" />
</button>
@if (linksAreOpen()) {
  <a
    class="link practice"
    routerLink="practice"
    [class.pulse]="pulsePractice()"
  >
    <app-icon-comp type="learn" />
  </a>
  <a routerLink="cards" class="link">
    <app-icon-comp type="list" />
  </a>
  <a routerLink="collections" class="link">
    <app-icon-comp type="collection" />
  </a>
  <a routerLink="settings" class="link">
    <app-icon-comp type="settings" />
  </a>
}
