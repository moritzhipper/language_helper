<app-page-wrapper-comp
  title="Settings"
  [desktopMode]="'shrink'"
  icon="settings"
>
  <div class="wrapper">
    <div class="stats">
      <app-counter-comp label="banks" size="l">
        {{ stats().banksCount }}
      </app-counter-comp>
      <app-counter-comp label="learnables" size="l">
        {{ stats().learnablesCount }}
      </app-counter-comp>
      <app-counter-comp label="collections" size="l">
        {{ stats().collectionsCount }}
      </app-counter-comp>
      <app-counter-comp label="tokens used" class="tokens">
        {{ tokensUsed() }}
      </app-counter-comp>
    </div>

    <form [formGroup]="form">
      <label>
        <span> OpenAI API-key </span>
        <input type="password" formControlName="apiKey" />
      </label>

      <label>
        <span> I am learning </span>
        <input type="text" />
      </label>
      <label>
        <span> I am speaking </span>
        <input type="text" />
      </label>
    </form>
    <div class="data-interact">
      <button class="delete" (click)="reset()">delete all cards</button>
      <a
        class="big export"
        [download]="learnablesDownload().fileName"
        [attr.href]="learnablesDownload().blobUrl"
        >export all cards
      </a>
    </div>
  </div>
</app-page-wrapper-comp>
