<app-page-wrapper-comp title="Settings" desktopMode="center" icon="settings">
  <div class="wrapper">
    <div class="stats">
      You have created <strong>{{ stats().banksCount }} bank</strong> holding
      <strong>{{ stats().collectionsCount }} collections</strong> having a total
      of <strong>{{ stats().learnablesCount }} learnables</strong>. You also
      spent <strong>{{ tokensUsed() }} tokens</strong> to generate cards.
    </div>
    <div class="banks">
      @for (bank of banks(); track bank.id) {
        <app-bank-settings-card [bank]="bank" />
      }
      <div class="add-bank">
        <button (click)="createNewBank()">
          <app-icon-comp type="add" [size]="32" />
        </button>
      </div>
    </div>

    <form [formGroup]="form">
      <label>
        <span> OpenAI API-key </span>
        <input type="password" formControlName="apiKey" />
      </label>
    </form>
    <div class="data-interact">
      <button class="primary big delete" (click)="reset()">
        delete everything
      </button>
    </div>
  </div>
</app-page-wrapper-comp>
