<app-page-wrapper-comp title="Practice" desktopMode="shrink" icon="learn">
  <div class="selection-view">
    <app-counter-comp label="cards in set" size="l">
      {{ selectedCardsIds().length }}
    </app-counter-comp>

    <form [formGroup]="form" (ngSubmit)="start()">
      <app-radio-comp
        [config]="[
          { label: 'all', value: null },
          { value: 'word' },
          { value: 'phrase' }
        ]"
        formControlName="type"
        label="type"
      />
      <app-radio-comp
        [config]="[
          { value: null, label: 'all' },
          { value: 'low' },
          { value: 'medium' }
        ]"
        formControlName="confidence"
        label="max confidence"
      />
      <app-radio-comp
        [config]="[
          { value: false, label: speakingLang() },
          { value: true, label: learningLang() }
        ]"
        label="guess language"
        formControlName="reverseDirection"
      />
      <label>
        <span> collection </span>
        <select formControlName="collectionIdentifier">
          @for (pseudo of pseudoCollections(); track pseudo.name) {
            <option [value]="pseudo.name">
              {{ pseudo.name }}
              ({{ calculateAverageConfidence(pseudo.learnableIDs) }}%)
            </option>
          }

          @for (collection of collections(); track collection.id) {
            <option [value]="collection.id">
              {{ collection.name }}
              ({{ calculateAverageConfidence(collection.learnableIDs) }}%)
            </option>
          }
        </select>
      </label>
      <button
        type="submit"
        class="icon"
        [disabled]="selectedCardsIds().length === 0"
      >
        start
        <app-icon-comp type="learn" />
      </button>
    </form>
  </div>
</app-page-wrapper-comp>
