@let sum = summary();

<h2>{{ texts().title }}</h2>
<app-practice-rating-comp [rating]="sum.rating" />
<div class="stats">
  <div>{{ sum.correctGuesses }} correct guesses</div>
  <div>{{ sum.wrongGuesses }} wrong guesses</div>
  <div>{{ sum.unansweredGuesses }} unanswered guesses</div>
  <div>{{ sum.guessedRightPercent }}% guessed right</div>
</div>
<div class="subtitle">{{ texts().subtitle }}</div>

<div class="line-wrapper">
  <div class="line"></div>
</div>
