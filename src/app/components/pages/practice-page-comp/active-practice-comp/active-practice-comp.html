<app-page-wrapper-comp icon="learn">
  <div
    class="practice-view"
    (touchstart)="swipeStart($event)"
    (touchmove)="swipeMove($event)"
    (touchend)="swipeEnd($event)"
    [class]="stateClasses()"
  >
    @for (entry of cardViewModel(); track trackCard(entry)) {
      @if ('id' in entry.content) {
        <app-practice-card-comp
          class="card"
          [class]="'index-' + entry.viewIndex"
          (click)="reveal()"
          [learnable]="entry.content"
          [reverseDirection]="currentPractice().reverseDirection"
        />
      } @else if (!('id' in entry.content)) {
        <app-practice-summary-card
          class="card summary"
          [class]="'index-' + entry.viewIndex"
          [summary]="entry.content"
        />
      }
    }
    <app-practice-stats-bar-comp
      [(isOpen)]="statsOpen"
      [cardState]="focusedCardState()"
      [isFinished]="isFinished()"
      (edit)="editNote()"
      (quit)="quit()"
    />
  </div>
</app-page-wrapper-comp>
