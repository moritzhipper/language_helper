<app-page-wrapper-comp icon="learn">
  <div
    class="practice-view"
    (pointerdown)="swipeStart($event)"
    (pointermove)="swipeMove($event)"
    (pointerup)="swipeEnd($event)"
    [class]="stateClasses()"
  >
    <app-icon-comp class="vote-overlay right" type="right-guess" [size]="200" />
    <app-icon-comp class="vote-overlay wrong" type="wrong-guess" [size]="200" />

    @for (entry of cardViewModel(); track trackCard(entry)) {
      @if ('id' in entry.content) {
        <app-practice-card-comp
          class="card"
          [class]="'index-' + entry.viewIndex"
          (click)="reveal()"
          [concealed]="entry.viewIndex > 0"
          [learnable]="entry.content"
          [allowEdit]="cardState() === 'editing' && entry.viewIndex === 0"
          [reverseDirection]="currentPractice().reverseDirection"
          (updateNotes)="updateNotes($event)"
        />
      } @else if (!('id' in entry.content)) {
        <app-practice-summary-card
          class="card summary"
          [concealed]="entry.viewIndex > 0"
          [class]="'index-' + entry.viewIndex"
          [summary]="entry.content"
        />
      }
    }
    <app-practice-stats-bar-comp
      [(isOpen)]="statsOpen"
      [cardState]="cardState()"
      [isFinished]="isFinished()"
      (edit)="editNote()"
      (quit)="quit()"
    />
  </div>
</app-page-wrapper-comp>
