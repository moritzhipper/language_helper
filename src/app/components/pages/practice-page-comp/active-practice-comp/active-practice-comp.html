<app-page-wrapper-comp icon="learn">
  <div class="practice-view">
    @for (learnable of learnablesInPractice(); track learnable.id) {
      @if (isCardVisible(currentPractice().index, $index)) {
        @let pracIndex = currentPractice().index;
        <div
          class="card"
          [class.swiping]="isSwiping()"
          (touchstart)="swipeStart($event)"
          (touchmove)="swipeMove($event)"
          (touchend)="swipeEnd($event)"
          (click)="reveal()"
          [class.overnext]="cardDistance(pracIndex, $index) === 2"
          [class.next]="cardDistance(pracIndex, $index) === 1"
          [class.current]="cardDistance(pracIndex, $index) === 0"
          [class.last]="cardDistance(pracIndex, $index) === -1"
          [class.revealed]="isRevealed() && isCardCurrent(pracIndex, $index)"
          [class.is-correct]="isLastGuessCorrect()"
        >
          <div class="word top">
            {{ learnable.lexeme }}
          </div>
          <div class="word bottom">
            {{ learnable.translation }}
          </div>
        </div>
      }
    }
