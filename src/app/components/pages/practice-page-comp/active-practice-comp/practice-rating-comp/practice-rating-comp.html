@switch (rating()) {
  @case ('noteven') {
    <app-icon-comp class="single icon" type="heart" />
  }
  @case ('atleast') {
    <app-icon-comp class="icon" type="star-fill" size="auto" />
    <app-icon-comp class="icon" type="star" size="auto" />
    <app-icon-comp class="icon" type="star" size="auto" />
  }
  @case ('okay') {
    <app-icon-comp class="icon" type="star-fill" />
    <app-icon-comp class="icon" type="star" />
    <app-icon-comp class="icon" type="star-fill" />
  }
  @case ('good') {
    <app-icon-comp class="icon" type="star-fill" />
    <app-icon-comp class="icon" type="star-fill" />
    <app-icon-comp class="icon" type="star-fill" />
  }
  @case ('excellent') {
    <app-icon-comp type="meteor" class="icon single" />
  }
}
