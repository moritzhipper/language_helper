@let card = learnable();
@let rev = reverseDirection();

<div class="top">
  {{ rev ? card.translation : card.lexeme }}
</div>
<div class="bottom">
  <div class="word">
    {{ rev ? card.lexeme : card.translation }}
  </div>
  <div class="notes">
    @if (card.notes; as notes) {
      {{ notes }}
    } @else {
      <span class="placeholder"> no notes </span>
    }
  </div>
</div>
