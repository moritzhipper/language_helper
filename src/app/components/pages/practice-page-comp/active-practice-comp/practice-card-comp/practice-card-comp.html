@let dir = reverseDirection();
@let card = learnable();

<div class="top">{{ dir ? card.lexeme : card.translation }}</div>
<div class="bottom">{{ dir ? card.translation : card.lexeme }}</div>
<textarea
  class="notes"
  placeholder="no notes"
  (input)="setUpdatedNotes(textArea.value)"
  [disabled]="!allowEdit()"
  #textArea
></textarea>
