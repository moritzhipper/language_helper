<app-page-wrapper-comp title="Practice" desktopMode="shrink" icon="learn">
  <div class="finished-view">
    <div class="summary">
      <div class="counter">
        {{ summary().correctGuesses }} of
        {{ summary().cardsAmount }}
      </div>
      Cards guessed correctly!
    </div>
    <button (click)="endPractice()" class="big">finish practice</button>
  </div>
</app-page-wrapper-comp>
