<app-page-wrapper-comp title="Practice" desktopMode="shrink" icon="learn">
  <div class="finished-view">
    <app-counter-comp label="Cards guessed correctly" size="l" class="summary">
      {{ summary().correctGuesses }} of
      {{ summary().cardsAmount }}
    </app-counter-comp>
    <button (click)="endPractice()" class="big">finish</button>
  </div>
</app-page-wrapper-comp>
