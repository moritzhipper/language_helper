<app-page-wrapper-comp title="Collections" [shrinkOnDesktop]="false">
  <div class="edit-bubbles">
    <button type="" class="import" (click)="fileInput.click()">
      <app-icon-comp type="import" />
      <input
        type="file"
        [accept]="'.' + config.fileExportSuffix"
        #fileInput
        (change)="importCollection($event)"
      />
    </button>
    @if (selectedCollection(); as collection) {
      <a
        class="export"
        [download]="collectionDownload()?.fileName"
        [attr.href]="collectionDownload()?.blobUrl"
      >
        <app-icon-comp type="share" />
      </a>
      <button class="edit" (click)="renameCollection(collection)">
        <app-icon-comp type="edit" />
      </button>
      <button (click)="deleteCollection(collection)" class="delete">
        <app-icon-comp type="trash" />
      </button>
    }
  </div>
  @if (collections().length === 0) {
    <p class="empty-state">no collections available</p>
  }
  <div class="collections">
    @for (collection of collections(); track collection.id) {
      <button
        class="silent collection"
        (click)="select(collection.id)"
        [class.selected]="selectedCollectionId() === collection.id"
      >
        <app-collection-comp
          [collection]="collection"
          [avgGuessesPercent]="calcAvgGuesses(collection.id)"
        />
      </button>
    }
  </div>
</app-page-wrapper-comp>
