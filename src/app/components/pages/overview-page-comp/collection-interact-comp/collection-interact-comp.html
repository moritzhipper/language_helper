<select [(ngModel)]="selectedCollectionId" class="ellipsis">
  @for (option of selectionOptions(); track option.id) {
    <option [value]="option.id">{{ option.name }}</option>
  }
</select>
@if (userCollectionSelected()) {
  <button class="silent fly-in-x-rev-1" (click)="edit.emit()">
    <app-icon-comp type="edit" />
  </button>
  <button class="silent fly-in-x-rev-2" (click)="share.emit()">
    <app-icon-comp type="share-network" />
  </button>
  @if (downloadable(); as down) {
    <a
      class="silent fly-in-x-rev-3"
      [download]="down.fileName"
      [attr.href]="down.blobUrl"
    >
      <app-icon-comp type="share" />
    </a>
  }
  <button class="silent delete fly-in-x-rev-4" (click)="delete.emit()">
    <app-icon-comp type="trash" />
  </button>
} @else {
  @for (option of selectButtonOptions(); track option.id; let i = $index) {
    <button
      (click)="selectedCollectionId.set(option.id)"
      [class.selected]="selectedCollectionId() === option.id"
      class="small fake-select"
      [class]="'fly-in-x-rev-' + i"
    >
      {{ option.name }}
    </button>
  }
}
