<form [formGroup]="form" [class.opened]="showFilter()">
  @if (showFilter()) {
    <label class="search">
      <span>search</span>
      <input type="text" formControlName="search" />
    </label>

    <div class="radios">
      <app-radio-comp
        [config]="[
          { value: null, label: 'all' },
          { value: 'word' },
          { value: 'phrase' }
        ]"
        formControlName="type"
        label="type"
      />
      <app-radio-comp
        class="confidence"
        [config]="[
          { value: null, label: 'all' },
          { value: 'low' },
          { value: 'medium' }
        ]"
        formControlName="confidence"
        label="max confidence"
      />

      <app-radio-comp
        [config]="[
          { value: null, label: 'all' },
          { value: 'newest' },
          { value: 3, label: '< 3 days' }
        ]"
        formControlName="age"
        label="age"
      />

      <app-radio-comp
        [config]="[
          { value: 'created' },
          { value: 'lexeme' },
          { value: 'confidence' }
        ]"
        formControlName="orderBy"
        label="order by"
      />

      <app-radio-comp
        [config]="[{ value: 'asc' }, { value: 'desc' }]"
        formControlName="order"
        label="order"
      />
    </div>
  }
</form>
<button
  class="toggle silent"
  type="button"
  (click)="toggleExpanded()"
  [class.expanded]="showFilter()"
>
  @if (!isInitialValue()) {
    <app-icon-comp type="warn" class="icon warn" />
  }
  <span>filter</span>
  <app-icon-comp type="chevron" [size]="30" class="icon" />
</button>
