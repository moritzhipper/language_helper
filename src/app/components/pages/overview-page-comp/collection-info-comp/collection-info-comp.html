@let conf = config();

<h2 class="ellipsis">{{ conf.header }}</h2>
<div class="stats">
  <span class="word-list-item"> {{ conf.averageConfidence }}% confidence </span>
  <span class="word-list-item"> {{ conf.cardCount }} cards </span>
  @if (conf.date) {
    <span class="word-list-item">
      {{ conf.date | date: 'mediumDate' }}
    </span>
  }
</div>
