@let coll = selectedCollection();
@let isUserCollection = 'created' in coll;

<h2 class="ellipsis">{{ coll.name }}</h2>
<div class="stats">
  <span> {{ averageConfidence() }}% confidence </span>
  <span> {{ coll.learnableIDs.length }} cards </span>

  @if (isUserCollection) {
    <span>
      {{ coll.created | date: 'MMM d, y' }}
    </span>
  }
</div>
