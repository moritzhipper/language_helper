@let coll = collection();

<div class="info">
  <h2>{{ coll.name }}</h2>
  {{ confidencePercent() }}% confidence • {{ coll.learnableIDs.length }} cards
  @if ('created' in coll) {
    • {{ coll.created | date: 'MMMM d, y' }}
  }
</div>
<div class="interact">
  <button class="silent">
    <app-icon-comp type="learn" />
  </button>

  <button class="silent">
    <app-icon-comp type="edit" />
  </button>
  <button class="silent">
    <app-icon-comp type="share-network" />
  </button>
  <button class="silent">
    <app-icon-comp type="share" />
  </button>
  <button class="silent">
    <app-icon-comp type="trash" />
  </button>
</div>
