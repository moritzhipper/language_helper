<div class="header">
  <div class="name">{{ header() }}</div>
  <button class="silent copy" (click)="copyId.emit()">
    <app-icon-comp type="copy" />
  </button>
</div>
<div class="info">
  @let _c = counter();
  @if (holdsMultipleCollections()) {
    <span> {{ _c.collections }} </span>
  }
  <span> {{ _c.words }} words </span>
  <span> {{ _c.phrases }} phrases </span>
</div>

<div class="shared">{{ bank().created | date: 'mediumDate' }}</div>
<div class="ttl">expires in {{ ttl() }}</div>
<div class="counter">{{ _c.cards }}</div>
