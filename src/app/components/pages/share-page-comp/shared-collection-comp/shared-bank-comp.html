<div class="header">
  <div class="name">{{ bank().name }}</div>
  <button
    class="silent copy"
    [disabled]="ttl().isExpired"
    (click)="copyId.emit()"
  >
    <app-icon-comp type="copy" />
  </button>
</div>
<div class="info">
  @let _c = counter();

  @if (bank().collections.length > 1) {
    <span> {{ _c.collections }} collections </span>
  }
  <span> {{ _c.words }} </span>
  <span> {{ _c.phrases }} </span>
</div>

<div class="shared">{{ bank().created | date: 'mediumDate' }}</div>

<div class="ttl">{{ ttl().label }}</div>
<div class="counter">{{ _c.cards }}</div>
