<app-page-wrapper-comp
  title="Share"
  icon="share-network-fill"
  desktopMode="center"
>
  <h2>you recently shared</h2>
  <div class="collections">
    @for (bank of userBanks; track bank.name) {
      <app-shared-bank-comp [bank]="bank" />
    }
  </div>
  <h2>community</h2>
  <div class="collections">
    @for (bank of onlineBanks; track bank.name) {
      <app-shared-bank-comp [bank]="bank" />
    }
  </div>
</app-page-wrapper-comp>
